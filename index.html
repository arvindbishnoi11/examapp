<!doctype html>
<html lang="en-IN" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PrepSetu — Class 11, 12, JEE &amp; NEET preparation</title>
    <meta
      name="description"
      content="PrepSetu brings curated video lectures, chapter tests, full-length mocks and previous-year papers for Class 11, Class 12, JEE Main, JEE Advanced and NEET."
    />
    <meta name="theme-color" content="#4f46e5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PrepSetu" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <link rel="preconnect" href="https://i.ytimg.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.youtube-nocookie.com" />

    <!-- Public runtime configuration (generated at build time; never contains secrets) -->
    <script src="/env.js"></script>
  </head>
  <body class="h-full bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
    <noscript>
      <div style="font-family: system-ui, sans-serif; padding: 2rem; max-width: 40rem; margin: 0 auto">
        <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem">PrepSetu needs JavaScript</h1>
        <p>Please enable JavaScript in your browser to use lectures, tests and mock examinations.</p>
      </div>
    </noscript>

    <div id="root" class="min-h-full">
      <!-- Skeleton shown until React mounts (keeps first paint fast on slow phones) -->
      <div id="boot-skeleton" style="padding: 1.25rem; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif">
        <div style="height: 3rem; border-radius: 1rem; background: linear-gradient(90deg, #eef2ff, #f8fafc, #eef2ff); background-size: 200% 100%; animation: psshimmer 1.4s ease-in-out infinite"></div>
        <div style="height: 8rem; margin-top: 1rem; border-radius: 1.25rem; background: linear-gradient(90deg, #eef2ff, #f8fafc, #eef2ff); background-size: 200% 100%; animation: psshimmer 1.4s ease-in-out infinite"></div>
        <div style="height: 12rem; margin-top: 1rem; border-radius: 1.25rem; background: linear-gradient(90deg, #eef2ff, #f8fafc, #eef2ff); background-size: 200% 100%; animation: psshimmer 1.4s ease-in-out infinite"></div>
        <style>
          @keyframes psshimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
          @media (prefers-color-scheme: dark) {
            #boot-skeleton div { background: linear-gradient(90deg, #1e293b, #0f172a, #1e293b) !important; background-size: 200% 100% !important; }
          }
        </style>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
